<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boneca &amp; Moda</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>Boneca &amp; Moda</h1>
  <div class="actions">
    <button id="btnRandom" class="btn primary">Surpreenda-me</button>
    <button id="btnSave" class="btn">Salvar</button>
    <button id="btnLoad" class="btn">Carregar</button>
    <button id="btnReset" class="btn ghost">Limpar</button>
    <button id="btnPose" class="btn ghost">Foto</button>
  </div>
</header>

<main class="layout">
  <section class="stage-wrap">
    <div class="stage" id="stage">
      <svg id="scene" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <p class="hint">Clique nas peças para vestir a boneca. Some tudo com “Limpar”.</p>
  </section>

  <aside class="panel">
    <nav class="tabs" id="tabs"></nav>
    <div class="tab-body">
      <div class="items" id="items"></div>
      <div class="swatches" id="swatches"></div>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/scenes.js"></script>
<script src="js/doll.js"></script>
<script src="js/app.js"></script>
</body>
</html>
